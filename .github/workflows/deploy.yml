name: Gatsby Build & Deploy

on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set Node 20
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: Check Yarn Cache
        id: cache-yarn
        uses: actions/cache@v2
        env:
          cache-name: cache-yarn
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Check Gatsby Cache
        uses: actions/cache@v2
        id: gatsby-cache-folder
        with:
          path: .cache
          key: ${{ runner.os }}-cache-site
          restore-keys: |
            ${{ runner.os }}-cache-site

      - name: Check Gatsby Public Folder
        uses: actions/cache@v2
        id: gatsby-public-folder
        with:
          path: public/
          key: ${{ runner.os }}-public-site
          restore-keys: |
            ${{ runner.os }}-public-site

      - name: Install dependencies
        if: steps.cache-yarn.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Install Gatsby CLI
        run: yarn global add gatsby-cli

      - name: Build
        run: gatsby build --log-pages
        env:
          NODE_ENV: production
          ENVIRONMENT: ${{ contains(github.ref, 'main') && 'production' || 'staging'}}
          GATSBY_WP_GRAPH_API: ${{ secrets.GATSBY_WP_GRAPH_API }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.1
        with:
          branch: gh-pages
          folder: public
